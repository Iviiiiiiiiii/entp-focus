<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1d1d1f; --muted:#76736c; --line:#e3e0d9;
  --accent:#f0643c; --accent-soft:#fde7df; --accent-text:#c2441f; --ok:#2f9e6a; --ok-soft:#dcf2e6;
  --warn:#c98a00; --warn-soft:#fbf0d2; --blue:#3d6fe0; --blue-soft:#e1e9fb; --purple:#8a55d6; --purple-soft:#eee4fb;
  --grey-soft:#ebeae6; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121214; --surface:#1c1c1f; --surface2:#26262a; --text:#f2f1ee; --muted:#9b988f; --line:#2f2f34;
    --accent:#ff7a52; --accent-soft:#3a2219; --accent-text:#ff9d7d; --ok:#4cc38a; --ok-soft:#173226;
    --warn:#e3a92b; --warn-soft:#352a10; --blue:#7aa0ff; --blue-soft:#1c2640; --purple:#b48cf0; --purple-soft:#2a2038;
    --grey-soft:#2a2a2e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
.hidden{display:none!important}
/* header */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 16px) 8px calc(var(--sal) + 16px);display:flex;align-items:center;gap:8px;
  border-bottom:.5px solid transparent}
.topbar h1{font-size:28px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.02em;flex:1}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:24px;height:24px}
main{padding:4px calc(var(--sar) + 16px) calc(var(--sab) + 96px) calc(var(--sal) + 16px);max-width:680px;margin:0 auto}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:.5px solid var(--line);
  padding:4px calc(var(--sar) + 4px) calc(var(--sab) + 4px) calc(var(--sal) + 4px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}
/* cards */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin:12px 0}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-text);letter-spacing:.06em}
.ml-head h2{margin:2px 0 4px;font-size:21px;line-height:1.3;font-weight:700}
.preview{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin:0}
.chev{float:right;color:var(--muted);font-size:13px;margin-top:2px}
.btn-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.btn-row.three{display:grid;grid-template-columns:1fr 1.25fr 1.1fr;gap:6px}
.btn-row.three .pill{padding:0 6px;font-size:14px;gap:4px}
.pill{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center;white-space:nowrap}
.pill:active{transform:scale(.97)}
.pill.accent{background:var(--accent);color:#fff}
.pill.soft{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
.pill.small{min-height:36px;font-size:14px;padding:0 12px;flex:none}
.pill.danger{color:#d93a3a}
.big-input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.big-input:focus{border-color:var(--accent)}
.quick{background:var(--accent-soft);border-radius:16px;padding:10px;margin:10px 0}
.quick .big-input{border-color:transparent}
.quick small{display:block;color:var(--accent-text);margin:6px 4px 0;font-size:12px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 6px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.section-title .count{font-weight:600;background:var(--grey-soft);border-radius:10px;padding:0 7px;font-size:12px}
/* task rows */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:4px;min-height:56px;border-bottom:.5px solid var(--line);padding-right:6px}
.row:last-child{border-bottom:0}
.check{width:48px;height:52px;display:grid;place-items:center;flex:none}
.check i{width:24px;height:24px;border-radius:12px;border:2px solid var(--muted);display:grid;place-items:center;transition:.15s}
.check.on i{background:var(--ok);border-color:var(--ok)}
.check.on i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check[disabled]{opacity:.35}
.row-main{flex:1;min-width:0;padding:9px 0;text-align:left}
.row-title{font-size:16px;word-break:break-word}
.row.done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;align-items:center}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--grey-soft);color:var(--muted);line-height:1.5}
.tag.accent{background:var(--accent-soft);color:var(--accent-text)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}
.star{width:44px;height:44px;display:grid;place-items:center;color:var(--line);font-size:20px;flex:none}
.star.on{color:var(--accent)}
.focus-card{border:2px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%);padding:4px 6px 12px 0}
.focus-card .row{border:0}
.focus-card .label{font-size:12px;font-weight:700;color:var(--accent-text);padding:10px 0 0 16px;letter-spacing:.06em}
.focus-card .minact{margin:0 12px 0 52px;font-size:14px;background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--text)}
.focus-card .minact b{color:var(--accent-text);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:14px}
details.fold summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"展开";margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
details.fold[open] summary::after{content:"收起"}
.inline-act{min-height:34px;padding:0 10px;border-radius:17px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);flex:none;white-space:nowrap}
/* ideas */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:6px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted);flex:none}
.chip.on{background:var(--text);color:var(--bg)}
.chip .n{opacity:.6;margin-left:4px;font-weight:500}
.idea{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.idea-main{padding:14px 16px 8px;text-align:left;width:100%;display:block}
.idea-title{font-size:16px;font-weight:600;word-break:break-word}
.idea-acts{display:flex;border-top:.5px solid var(--line)}
.idea-acts button{flex:1;min-height:44px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.idea-acts button + button{border-left:.5px solid var(--line)}
.idea-acts button.cur{color:var(--accent-text);font-weight:700;background:var(--accent-soft)}
.banner{border-radius:16px;padding:14px 16px;background:var(--blue-soft);color:var(--blue);font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.banner b{display:block;font-size:15px}
.banner .x{margin-left:auto;font-size:18px;width:32px;height:32px;flex:none}
/* today */
.datenav{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.datenav .nav{width:44px;height:44px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);font-size:20px;flex:none}
.datebox{flex:1;position:relative;min-height:44px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;overflow:hidden}
.datebox small{font-weight:500;color:var(--muted);margin-left:6px;font-size:13px}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;-webkit-appearance:none;appearance:none}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:10px 4px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--grey-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
/* calendar */
.calhead{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.calhead h3{flex:1;text-align:center;margin:0;font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 8px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 6px}
.day{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative;min-height:44px}
.day.out{opacity:.28}
.day.today .dn{color:var(--accent-text);font-weight:800}
.day.sel{background:var(--text);color:var(--bg)}
.day.sel .dn{color:var(--bg)}
.day .cnt{font-size:10px;font-weight:700;min-width:18px;height:16px;border-radius:8px;background:var(--ok);color:#fff;display:grid;place-items:center;padding:0 4px;margin-top:2px}
.day .cnt.l2{background:color-mix(in srgb,var(--ok) 80%,#000)}
.day .dot{height:16px;margin-top:2px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:52px;flex:none;text-align:center}
/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.overlay.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:calc(100% - var(--sat) - 24px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s ease}
.overlay.show .sheet{transform:none}
.sheet-head{display:flex;align-items:center;padding:10px 8px 6px 18px;gap:6px;border-bottom:.5px solid var(--line)}
.sheet-head h3{flex:1;margin:0;font-size:17px;font-weight:700}
.sheet-head .done-btn{min-height:44px;padding:0 12px;color:var(--accent-text);font-weight:700}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(var(--sab) + 24px)}
.field{margin:0 0 14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 4px 6px}
.field .hint{font-weight:400;font-size:12px;margin-left:6px}
.tinput,.tarea,.tselect{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
.tinput:focus,.tarea:focus,.tselect:focus{border-color:var(--accent)}
.tarea{min-height:88px;resize:vertical;line-height:1.55}
.tarea.tall{min-height:220px}
.title-input{font-size:20px;font-weight:700;border:0;background:transparent;padding:6px 4px;width:100%;outline:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.vault-item{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:8px 0}
.vault-item h4{margin:0 0 2px;font-size:16px}
.vault-item .btn-row{margin:8px 0 0}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted)}
.ts{font-size:12px;color:var(--muted);margin:6px 4px}
body.locked .topbar,body.locked main,body.locked .tabbar{display:none}
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;
  padding:calc(var(--sat) + 40px) calc(var(--sar) + 22px) calc(var(--sab) + 30px) calc(var(--sal) + 22px)}
.lock-card{width:100%;max-width:380px;text-align:center}
.lock-icon{width:76px;height:76px;border-radius:18px;box-shadow:var(--shadow);margin:8px auto 10px;display:block}
.lock-card h2{margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em}
.lock-sub{color:var(--muted);margin:4px 0 18px;font-size:15px}
.lock-card .big-input{margin:6px 0;font-size:17px;text-align:center;letter-spacing:.04em}
.lock-warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:14px;text-align:left;margin:10px 0;font-weight:600}
.lock-info{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:11px 13px;font-size:14px;text-align:left;margin:10px 0}
.lock-err{color:#d93a3a;min-height:22px;font-size:14px;margin:4px 0}
.lock-btn{width:100%;min-height:50px;font-size:17px}
.lock-btn[disabled]{opacity:.6}
.lock-link{min-height:44px;padding:0 14px;color:var(--muted);font-size:14px;text-decoration:underline;margin-top:12px}
.lock-foot{color:var(--muted);font-size:12px;margin-top:22px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
.seg.two{grid-template-columns:1fr 1fr;margin:4px 0 8px}
.warnnote{background:var(--warn-soft);color:var(--warn)}
</style>
</head>

<script>
"use strict";
(function(){
const KEY='entpFocus.data', BAK='entpFocus.backup', SCHEMA=1;
const STATES=[['new','未审视','tag'],['incubate','待孵化','tag warn'],['trying','正在尝试','tag blue'],['archived','已归档','tag purple']];
const STATE_LABEL=Object.fromEntries(STATES.map(s=>[s[0],s[1]]));
const STATE_CLS=Object.fromEntries(STATES.map(s=>[s[0],s[2]]));
let S=null;
const ui={tab:'main',ideaFilter:'all',quickIdea:false,todayDate:null,calY:null,calM:null,calSel:null,motivBanner:false,sheet:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const WD='日一二三四五六';
const fmtDay=s=>{const d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日';};
const relDay=s=>{const t=today();if(s===t)return '今天';if(s===addDays(t,-1))return '昨天';if(s===addDays(t,1))return '明天';return '周'+WD[parseD(s).getDay()];};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isEnter=e=>e.key==='Enter'&&!e.isComposing&&e.keyCode!==229;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1900);}

/* ---------- storage ---------- */
function validate(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.mainlines)) throw new Error('不是有效的备份文件（缺少 mainlines）');
  d.schema=d.schema||1;
  if(d.schema>SCHEMA) throw new Error('备份来自更新的版本（schema '+d.schema+'），无法导入');
  ['tasks','ideas','ledger'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  d.mainlines.forEach(m=>{m.id=m.id||uid();m.title=m.title||'未命名主线';m.body=m.body||'';m.archived=!!m.archived;});
  if(!d.mainlines.some(m=>!m.archived)){
    if(d.mainlines.length) d.mainlines[0].archived=false;
    else d.mainlines.push(newMainline('我的主线',''));
  }
  const cur=d.mainlines.find(m=>m.id===d.currentId&&!m.archived);
  if(!cur) d.currentId=d.mainlines.find(m=>!m.archived).id;
  d.tasks.forEach(t=>{t.id=t.id||uid();t.title=t.title||'';t.done=!!t.done;});
  d.ideas.forEach(i=>{i.id=i.id||uid();if(!STATE_LABEL[i.state])i.state='new';});
  d.schema=SCHEMA;
  return d;
}
/* ---------- encrypted storage (Web Crypto: PBKDF2-SHA256 -> AES-GCM-256) ---------- */
const KEY_ENC='entpFocus.enc', BAK_ENC='entpFocus.backup.enc', ITER=310000, AUTO_LOCK_MS=5*60*1000;
const te=new TextEncoder(), tdc=new TextDecoder();
let K=null, SALT=null, IT=ITER, fails=0, hiddenAt=0, lockTimer=null, busy=false, exportCache=null, pendingImp=null;
const b64=buf=>{const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cryptoOK=()=>!!(window.isSecureContext&&window.crypto&&crypto.subtle&&crypto.getRandomValues);
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encStr(str,key,salt,iter){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(str));
  return {v:1,kdf:'PBKDF2-SHA256',cipher:'AES-GCM-256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decBlob(blob,key){return tdc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},key,unb64(blob.ct)));}
const isEncBlob=b=>!!(b&&typeof b==='object'&&b.ct&&b.iv&&b.salt);
function readBlob(k){try{const b=JSON.parse(localStorage.getItem(k)||'null');return isEncBlob(b)?b:null;}catch(e){return null;}}
let saveChain=Promise.resolve();
function save(){
  if(!K||!S)return saveChain;
  S.updatedAt=Date.now();
  const json=JSON.stringify(S), key=K, salt=SALT, it=IT;
  saveChain=saveChain.then(async()=>{const b=await encStr(json,key,salt,it);localStorage.setItem(KEY_ENC,JSON.stringify(b));})
    .catch(e=>{console.warn(e);toast('保存失败：存储空间不足？');});
  return saveChain;
}
async function writeBackup(obj){ // obj = {savedAt,data}
  const b=await encStr(JSON.stringify(obj),K,SALT,IT);b.savedAt=obj.savedAt;localStorage.setItem(BAK_ENC,JSON.stringify(b));
}
async function readBackup(){const b=readBlob(BAK_ENC);if(!b||!K||b.salt!==b64(SALT))return null;return JSON.parse(await decBlob(b,K));}
let saveTimer=null;
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}return save();}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;save();},350);}
window.addEventListener('pagehide',()=>{if(K)flush();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(!K)return;
    hiddenAt=Date.now();flush();
    clearTimeout(lockTimer);lockTimer=setTimeout(()=>{if(document.hidden&&K)lock();},AUTO_LOCK_MS);
  }else{
    clearTimeout(lockTimer);
    if(K&&hiddenAt&&Date.now()-hiddenAt>=AUTO_LOCK_MS)lock();
    hiddenAt=0;
  }
});
function legacyKeys(){const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k===KEY||k===BAK||k.indexOf(KEY+'.corrupt')===0)ks.push(k);}return ks;}
function wipeAll(){const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('entpFocus')===0)ks.push(k);}ks.forEach(k=>localStorage.removeItem(k));}

/* ---------- lock screen ---------- */
function showLock(mode,msg){
  document.body.classList.add('locked');
  $('#view').innerHTML='';
  const L=$('#lock');L.classList.remove('hidden');
  const icon=document.querySelector('link[rel="apple-touch-icon"]').href;
  let h=`<div class="lock-card"><img class="lock-icon" src="${icon}" alt=""><h2>专注手册</h2>`;
  if(mode==='insecure'){
    h+=`<p class="lock-sub">无法启动：当前打开方式不安全</p>
    <div class="lock-warn">为了用密码加密你的数据，本应用需要浏览器的加密功能（Web Crypto）。它只在 <b>https://</b> 网址（例如 GitHub Pages 地址）或 localhost 上可用。<br><br>请改用 https 地址打开本页面。本机已有的数据没有被读取或改动。</div>
    <p class="lock-foot">当前地址协议：${esc(location.protocol)}</p></div>`;
    L.innerHTML=h;return;
  }
  if(mode==='setup'){
    let hasOld=false;try{hasOld=!!localStorage.getItem(KEY);}catch(e){}
    h+=`<p class="lock-sub">设置一个密码，用来加密本机数据</p>
    ${hasOld?'<div class="lock-info">检测到本机已有未加密的数据。设置密码后会把它加密保存，并删除明文副本（包括导入前备份）。</div>':''}
    <div class="lock-warn">⚠️ 密码只保存在你自己脑子里，忘记了数据就无法恢复，请定期导出备份。</div>
    <form id="setupForm" autocomplete="on"><input type="text" class="sr" name="username" autocomplete="username" value="专注手册" tabindex="-1" aria-hidden="true">
      <input class="big-input" type="password" id="pw1" autocomplete="new-password" placeholder="设置密码（至少 4 位）" enterkeyhint="next" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input class="big-input" type="password" id="pw2" autocomplete="new-password" placeholder="再输入一次" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="lock-err" id="lockErr">${esc(msg||'')}</div>
      <button class="pill accent lock-btn" type="submit">设置密码并开始</button></form>`;
  }else{
    h+=`<p class="lock-sub">已锁定，输入密码解锁</p>
    <form id="unlockForm" autocomplete="on"><input type="text" class="sr" name="username" autocomplete="username" value="专注手册" tabindex="-1" aria-hidden="true">
      <input class="big-input" type="password" id="pwU" autocomplete="current-password" placeholder="密码" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="lock-err" id="lockErr">${esc(msg||'')}</div>
      <button class="pill accent lock-btn" type="submit">解锁</button></form>
    <button class="lock-link" type="button" data-act="forgotPw">忘记密码？</button>`;
  }
  h+=`<p class="lock-foot">数据用你的密码加密后保存在这个浏览器里（AES-GCM）。<br>密码本身不会被保存。</p></div>`;
  L.innerHTML=h;
  const f=L.querySelector('input[type=password]');if(f)setTimeout(()=>{try{f.focus();}catch(_){}},60);
}
function hideLock(){const L=$('#lock');L.classList.add('hidden');L.innerHTML='';document.body.classList.remove('locked');}
function setBtn(t){const b=document.querySelector('#lock button[type=submit]');if(!b)return;if(t){if(!b.dataset.t)b.dataset.t=b.textContent;b.textContent=t;b.disabled=true;}else{if(b.dataset.t)b.textContent=b.dataset.t;b.disabled=false;}}
function enterApp(msg){hideLock();render();window.scrollTo(0,0);if(msg)toast(msg);}
async function doSetup(){
  if(busy)return;
  const p1=$('#pw1').value,p2=$('#pw2').value,err=$('#lockErr');
  if(p1.length<4){err.textContent='密码至少 4 个字符';$('#pw1').focus();return;}
  if(!p2){$('#pw2').focus();return;}
  if(p1!==p2){err.textContent='两次输入的密码不一致';$('#pw2').value='';$('#pw2').focus();return;}
  busy=true;setBtn('正在加密…');err.textContent='';
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(p1,salt,ITER);
    let data=null,oldBak=null;
    const raw=localStorage.getItem(KEY);
    if(raw){try{data=validate(JSON.parse(raw));}catch(e){console.warn('旧数据无法解析，将使用导览数据',e);}}
    const rb=localStorage.getItem(BAK);
    if(rb){try{oldBak=JSON.parse(rb);validate(oldBak.data);}catch(e){oldBak=null;}}
    K=key;SALT=salt;IT=ITER;S=data||seed();
    await save();
    if(oldBak)await writeBackup({savedAt:oldBak.savedAt||Date.now(),data:oldBak.data});
    // 确认密文可解开之后，才删除明文
    const chk=readBlob(KEY_ENC);if(!chk)throw new Error('写入失败');
    validate(JSON.parse(await decBlob(chk,K)));
    legacyKeys().forEach(k=>localStorage.removeItem(k));
    fails=0;
    enterApp(data?'已加密原有数据，明文副本已删除':'密码已设置，数据已加密');
  }catch(e){console.warn(e);K=null;S=null;SALT=null;err.textContent='设置失败：'+(e.message||e);}
  finally{busy=false;setBtn();}
}
async function doUnlock(){
  if(busy)return;
  const inp=$('#pwU'),pw=inp.value,err=$('#lockErr');
  if(!pw){err.textContent='请输入密码';return;}
  const blob=readBlob(KEY_ENC);
  if(!blob){showLock('setup');return;}
  busy=true;setBtn('正在解锁…');err.textContent='';
  try{
    let text=null,key=null;
    try{key=await deriveKey(pw,unb64(blob.salt),blob.iter||ITER);text=await decBlob(blob,key);}catch(e){text=null;}
    if(text==null){
      fails++;await sleep(Math.min(700*fails,4000));
      err.textContent='密码不正确'+(fails>1?`（已失败 ${fails} 次）`:'');
      inp.value='';inp.focus();return;
    }
    let data;try{data=validate(JSON.parse(text));}catch(e){err.textContent='数据已解密但无法解析：'+e.message;return;}
    K=key;SALT=unb64(blob.salt);IT=blob.iter||ITER;S=data;fails=0;
    enterApp();
  }finally{busy=false;setBtn();}
}
async function lock(){
  if(!K)return;
  closeSheet(true);
  await flush();
  K=null;S=null;SALT=null;exportCache=null;pendingImp=null;
  showLock('unlock');
}
function forgotPw(){

/* ---------- model ---------- */
function newMainline(title,body){const n=Date.now();return{id:uid(),title,body:body||'',archived:false,focusTaskId:null,createdAt:n,updatedAt:n};}
function newTask(mainlineId,title){const n=Date.now();return{id:uid(),mainlineId:mainlineId||null,title,notes:'',minAction:'',result:'',next:'',done:false,doneAt:null,scheduledDate:null,createdAt:n,updatedAt:n};}
const ml=id=>S.mainlines.find(m=>m.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
const idea=id=>S.ideas.find(i=>i.id===id);
const cur=()=>ml(S.currentId);
const mlName=id=>{if(!id)return '收集箱';const m=ml(id);return m?m.title:'（已删除主线）';};
const doneDay=t=>t.doneAt?ymd(new Date(t.doneAt)):null;
function entryFor(t,date){return S.ledger.find(e=>e.taskId===t.id&&e.date===date);}
function ensureEntry(t,date,source){
  let e=entryFor(t,date);
  if(!e){e={id:uid(),date,taskId:t.id,title:t.title,mainlineId:t.mainlineId,mainlineTitle:mlName(t.mainlineId),source,carried:false,createdAt:Date.now()};S.ledger.push(e);}
  return e;
}
function setDone(t,done){
  if(done){
    t.done=true;t.doneAt=Date.now();
    const e=ensureEntry(t,today(),'done');e.title=t.title;e.mainlineTitle=mlName(t.mainlineId);
  }else{
    const d=doneDay(t);t.done=false;t.doneAt=null;
    S.ledger=S.ledger.filter(e=>!(e.taskId===t.id&&e.date===d&&e.source==='done'));
  }
  t.updatedAt=Date.now();save();
}
function schedule(t,date){
  const old=t.scheduledDate;
  if(old&&old!==date&&old>=today()){
    S.ledger=S.ledger.filter(e=>!(e.taskId===t.id&&e.date===old&&e.source==='plan'));
  }
  t.scheduledDate=date||null;
  if(date) ensureEntry(t,date,'plan');
  save();
}
function carryToToday(entry){
  const t=task(entry.taskId);if(!t)return;
  entry.carried=true;
  t.scheduledDate=today();
  const e=ensureEntry(t,today(),'carry');e.title=t.title;
  save();
}
function syncSnapshot(t){
  // 只有今天（及以后）的账本跟随改名；过去的账本保留当天标题
  const td=today();
  S.ledger.forEach(e=>{if(e.taskId===t.id&&e.date>=td){e.title=t.title;e.mainlineTitle=mlName(t.mainlineId);}});
}
function overdueEntries(){
  const td=today();
  const seen=new Set();
  return S.ledger.filter(e=>{
    if(e.date>=td||e.carried)return false;
    const t=task(e.taskId);if(!t||t.done)return false;
    if(entryFor(t,td))return false;
    if(seen.has(t.id))return false; // 同一任务只显示最近一次
    seen.add(t.id);return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

/* ---------- seed ---------- */
function seed(){
  const now=Date.now(), td=today(), yd=addDays(td,-1);
  const startToday=parseD(td).getTime();
  const tDone=Math.max(startToday+60000, now-25*60000);
  const yDone=parseD(yd).getTime()+21*3600000+15*60000;
  const A=newMainline('示例主线：用一周试试这个专注手册',
'这里是「当前主线」。你可以保存很多主线，但执行时页面只显示这一条，其他的都在「保管箱」里，不跟你抢注意力。\n\n点这张卡片可以改标题、写自由正文；离开输入框就会自动保存。\n\n这些导览内容都是普通数据，直接改成你自己的，或者删掉都可以。');
  const B=newMainline('保管箱示例：以后再做的另一条主线',
'放在保管箱里的主线不会被删除，也不会被判定为失败，只是暂时不占用执行注意力。\n\n在保管箱里点「设为当前」就能切换；「归档」相当于收进储藏室，随时可以恢复。');
  A.createdAt=B.createdAt=now-2*86400000;
  const t1=newTask(A.id,'把这条任务改成你真正要推进的事');
  t1.notes='点开任务可以写自由笔记。\n星标的任务就是「当前推进」，会被放大显示在最上面——一次只推进一件。';
  t1.minAction='打开任务，把标题改成一个今天就能开始的动作';
  t1.next='改完后点左边的圆圈完成它';
  const t2=newTask(A.id,'昨天没做完的事：试试「顺延到今天」');
  t2.notes='它昨天被安排进了今日清单，但没完成。系统不会自动把它挪到今天——去「今日清单」看看，由你决定要不要顺延。';
  t2.minAction='在今日清单里点「顺延到今天」';
  const t3=newTask(A.id,'勾选完成一个任务，看它出现在日历上');
  t3.result='完成时会记录日期和时间，并出现在「今日清单」和「完成日历」里。';
  const t4=newTask(null,'在今日清单里随手记一条收集箱任务');
  t4.result='收集箱任务不属于任何主线，适合零碎小事。';
  const tB=newTask(B.id,'这条主线下的任务，切换主线后才会出现');
  A.focusTaskId=t1.id;
  [t1,t2,t3,t4,tB].forEach((t,i)=>{t.createdAt=now-2*86400000+i*1000;});
  const st={schemaInit:true};
  S={schema:SCHEMA,createdAt:now,currentId:A.id,mainlines:[A,B],tasks:[t1,t2,t3,t4,tB],ideas:[],ledger:[]};
  // ledger
  t1.scheduledDate=td; ensureEntry(t1,td,'plan');
  t2.scheduledDate=yd; ensureEntry(t2,yd,'plan');
  t3.scheduledDate=td; ensureEntry(t3,td,'plan'); t3.done=true;t3.doneAt=tDone;
  t4.mainlineId=null; t4.scheduledDate=yd; ensureEntry(t4,yd,'plan'); t4.done=true;t4.doneAt=yDone;
  S.ledger.forEach((e,i)=>e.createdAt=now-86400000+i);
  const mk=(title,notes,state,mid,ago)=>({id:uid(),title,notes,state,mainlineId:mid||null,createdAt:now-ago,updatedAt:now-ago});
  S.ideas=[
    mk('未审视：执行时冒出的新点子，先写一句话放这里','在「当前主线」点「暂存新灵感」，不用离开页面就能记下。它不必有用，也不必和主线有关。','new',null,3600000),
    mk('待孵化：仍然感兴趣，但现在不开始','卡片底部的小图标可以直接改状态。孵化 = 先放着，以后再说。','incubate',null,7200000),
    mk('正在尝试：愿意为它做一次小实验','灵感可以关联一条主线，但关联不是必填项。这一条关联了示例主线。','trying',A.id,10800000),
    mk('已归档：暂时不看，但内容都还在','归档不会删除，点「恢复」就回到未审视。','archived',null,14400000)
  ];
  return S;
}

function completionsByDay(){

function renderCal(){

  const cells=Math.ceil((offset+days)/7)*7;
  let monthTotal=0;

  h+=`<div class="calgrid">`+'一二三四五六日'.split('').map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<cells;i++){

  }

  const list=(map[ui.calSel]||[]).sort((a,b)=>a.doneAt-b.doneAt);
  h+=`<div class="section-title">${fmtDay(ui.calSel)} · ${relDay(ui.calSel)} 完成 <span class="count">${list.length}</span></div>`;
  if(!list.length) h+=`<div class="card empty">这一天没有完成记录。</div>`;
  else h+=`<div class="list">`+list.map(t=>{const e=entryFor(t,ui.calSel);const title=e?e.title:t.title;const mt=e?(e.mainlineId?e.mainlineTitle:'收集箱'):mlName(t.mainlineId);

  return h;
}

function openSheet(title,html,onClose){
  closeSheet(true);
  const o=document.createElement('div');o.className='overlay';o.id='overlay';
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h3>${esc(title)}</h3><button class="done-btn" data-act="closeSheet">完成</button></div><div class="sheet-body">${html}</div></div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeSheet();});
  document.body.appendChild(o);
  ui.sheet={onClose};
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>o.classList.add('show'));
}
function closeSheet(silent){
  const o=$('#overlay');if(!o)return;
  if(document.activeElement)document.activeElement.blur();
  const cb=ui.sheet&&ui.sheet.onClose;ui.sheet=null;
  o.remove();document.body.style.overflow='';
  if(saveTimer)flush();
  if(cb)cb();
  if(!silent)render();
}
function refreshSheet(fn){const b=$('#overlay .sheet-body');if(b){const st=b.scrollTop;b.innerHTML=fn();b.scrollTop=st;}}
function mlOptions(sel,includeInbox,emptyLabel){
  let o=includeInbox?`<option value="">${emptyLabel}</option>`:'';
  S.mainlines.forEach(m=>{o+=`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.title)}${m.archived?'（已归档）':''}${m.id===S.currentId?'（当前）':''}</option>`;});
  return o;
}

function vaultHtml(){
  const act=S.mainlines.filter(m=>!m.archived), arc=S.mainlines.filter(m=>m.archived);
  const cnt=m=>{const ts=S.tasks.filter(t=>t.mainlineId===m.id);return `${ts.filter(t=>!t.done).length} 待推进 · ${ts.filter(t=>t.done).length} 已完成`;};
  let h=`<div class="note">执行时只显示一条主线。其他想做的事都放在这里，不删除、不评判，只是暂时不争夺注意力。</div>
  <button class="pill accent" style="width:100%" data-act="newMl">＋ 新建主线</button>
  <div class="section-title">保管中 <span class="count">${act.length}</span></div>`;
  act.forEach(m=>{const isCur=m.id===S.currentId;
    h+=`<div class="vault-item"><h4>${esc(m.title)} ${isCur?'<span class="tag accent">当前</span>':''}</h4><div class="meta">${cnt(m)}</div>${m.body?`<p class="preview" style="margin-top:4px">${esc(m.body)}</p>`:''}
    <div class="btn-row">${isCur?'':`<button class="pill small accent" data-act="setCur" data-id="${m.id}">设为当前</button>`}<button class="pill small" data-act="editMlV" data-id="${m.id}">编辑</button><button class="pill small" data-act="archiveMl" data-id="${m.id}">归档</button></div></div>`;});
  h+=`<div class="section-title">已归档 <span class="count">${arc.length}</span></div>`;
  if(!arc.length) h+=`<div class="note">没有归档的主线。归档相当于收进储藏室，任务和正文都会保留。</div>`;
  arc.forEach(m=>{h+=`<div class="vault-item" style="opacity:.8"><h4>${esc(m.title)}</h4><div class="meta">${cnt(m)}</div><div class="btn-row"><button class="pill small" data-act="restoreMl" data-id="${m.id}">恢复</button><button class="pill small" data-act="editMlV" data-id="${m.id}">查看</button></div></div>`;});
  return h;
}

    <div class="lock-err" id="pwErr"></div>
    <button class="pill accent" type="submit" style="width:100%">确认修改</button></form>
    <div class="note">修改后本机数据和导入前备份都会用新密码重新加密。之前导出的加密备份文件，仍需用当时的旧密码导入。<br><br>⚠️ 密码只保存在你自己脑子里，忘记了数据就无法恢复。</div>`);

async function doChangePw(){
  if(busy)return;
  const o=$('#pwOld').value,n1=$('#pwN1').value,n2=$('#pwN2').value,err=$('#pwErr');
  if(!o){err.textContent='请输入当前密码';return;}
  if(n1.length<4){err.textContent='新密码至少 4 个字符';return;}
  if(n1!==n2){err.textContent='两次输入的新密码不一致';return;}
  busy=true;err.textContent='正在验证…';
  try{
    await flush();
    const blob=readBlob(KEY_ENC);let ok=false;
    try{const k=await deriveKey(o,unb64(blob.salt),blob.iter||ITER);await decBlob(blob,k);ok=true;}catch(e){}
    if(!ok){fails++;await sleep(Math.min(700*fails,4000));err.textContent='当前密码不正确';$('#pwOld').value='';return;}
    let bak=null;try{bak=await readBackup();}catch(e){}
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(n1,salt,ITER);
    K=key;SALT=salt;IT=ITER;fails=0;
    await save();
    if(bak)await writeBackup(bak);else localStorage.removeItem(BAK_ENC);
    exportCache=null;closeSheet();toast('密码已修改，数据已重新加密');
  }catch(e){console.warn(e);err.textContent='修改失败：'+(e.message||e);}
  finally{busy=false;}
}

/* ---------- export / import ---------- */
function exportName(fmt){const d=new Date();return `entp-focus-backup-${today()}-${pad(d.getHours())}${pad(d.getMinutes())}-${fmt==='plain'?'PLAINTEXT':'encrypted'}.json`;}
function plainJson(){return JSON.stringify(Object.assign({app:'entp-focus',format:'plain',exportedAt:new Date().toISOString()},S),null,2);}
async function prepareExport(){
  exportCache=null;
  if(!K||!S)return null;
  const b=await encStr(JSON.stringify(S),K,SALT,IT);
  exportCache={enc:JSON.stringify(Object.assign({app:'entp-focus',format:'encrypted',exportedAt:new Date().toISOString()},b),null,2)};
  return exportCache;
}
function exportText(){
  if(ui.expFmt==='plain')return plainJson();
  if(exportCache&&exportCache.enc)return exportCache.enc;
  prepareExport();toast('正在准备加密备份，请再点一次');return null;
}
function exportDl(){
  const txt=exportText();if(!txt)return;
  const blob=new Blob([txt],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=exportName(ui.expFmt);a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  toast((ui.expFmt==='plain'?'已生成明文备份':'已生成加密备份')+'；若没有反应，请用「分享」或「复制 JSON」');
}
async function exportShare(){
  const txt=exportText();if(!txt)return;
  try{
    const file=new File([txt],exportName(ui.expFmt),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'专注手册备份'});}
    else{await navigator.share({title:'专注手册备份',text:txt});}
  }catch(e){if(e&&e.name!=='AbortError'){toast('分享失败，已改为显示 JSON');showExportBox(txt);}}
}
function showExportBox(txt){const b=$('#exportBox');if(!b)return;b.value=txt;b.classList.remove('hidden');b.focus();b.select();}
async function exportCopy(){
  const txt=exportText();if(!txt)return;
  try{await navigator.clipboard.writeText(txt);toast('已复制到剪贴板，可粘贴到备忘录保存');}
  catch(e){showExportBox(txt);try{document.execCommand('copy');toast('已复制（如未成功请手动全选复制）');}catch(_){toast('请手动全选下方文本复制');}}
}
async function doImport(text){
  let obj;
  try{obj=JSON.parse(text);}catch(e){alert('导入失败：不是有效的 JSON 文件');return;}
  if(isEncBlob(obj)){
    if(K&&obj.salt===b64(SALT)){ // 同一密码导出的备份，直接用当前密钥尝试
      try{return importData(JSON.parse(await decBlob(obj,K)));}catch(e){}
    }
    pendingImp=obj;
    openSheet('输入备份密码',`<div class="note">这是一个加密备份。请输入<b>导出这份备份时</b>使用的密码。</div>
      <form id="impPwForm"><input class="tinput" type="password" id="impPw" autocomplete="off" autocapitalize="off" placeholder="备份密码" enterkeyhint="go">
      <div class="lock-err" id="impErr"></div><button class="pill accent" type="submit" style="width:100%">解密并导入</button></form>`);
    setTimeout(()=>{const i=$('#impPw');if(i)i.focus();},250);
    return;
  }
  return importData(obj);
}
async function doImpPw(){
  if(busy||!pendingImp)return;
  const pw=$('#impPw').value,err=$('#impErr');
  if(!pw){err.textContent='请输入密码';return;}
  busy=true;err.textContent='正在解密…';
  let text=null;
  try{const k=await deriveKey(pw,unb64(pendingImp.salt),pendingImp.iter||ITER);text=await decBlob(pendingImp,k);}catch(e){}
  busy=false;
  if(text==null){fails++;await sleep(Math.min(700*fails,4000));err.textContent='密码不正确，无法解密这份备份';$('#impPw').value='';return;}
  fails=0;pendingImp=null;
  let obj;try{obj=JSON.parse(text);}catch(e){err.textContent='备份内容无法解析';return;}
  return importData(obj);
}
async function importData(obj){
  let d;
  try{d=validate(obj);}catch(e){alert('导入失败：'+(e.message||e));return;}
  const info=`将导入：${d.mainlines.length} 条主线、${d.tasks.length} 个任务、${d.ideas.length} 条灵感。\n\n这会覆盖当前全部数据（当前数据会先加密自动备份）。确定吗？`;
  if(!confirm(info))return;
  try{await writeBackup({savedAt:Date.now(),data:S});}
  catch(e){if(!confirm('自动备份当前数据失败（存储空间不足？）。仍然继续导入吗？'))return;}
  delete d.exportedAt;delete d.app;delete d.format;
  S=d;await save();exportCache=null;closeSheet();toast('导入完成');
}

  newMl(){const m=newMainline('','');S.mainlines.push(m);save();openMlDoc(m.id,true);},
  editMlV(el){openMlDoc(el.dataset.id);},
  setCur(el){S.currentId=el.dataset.id;save();closeSheet();ui.tab='main';render();window.scrollTo(0,0);toast('已切换主线');},
  archiveMl(el){
    const m=ml(el.dataset.id);const act=S.mainlines.filter(x=>!x.archived);
    if(act.length<=1){alert('这是最后一条活动主线，不能归档。先新建或恢复一条主线吧。');return;}
    m.archived=true;m.updatedAt=Date.now();
    if(S.currentId===m.id){S.currentId=S.mainlines.find(x=>!x.archived).id;toast('已归档，当前主线切换为「'+cur().title+'」');}else toast('已归档');
    save();refreshSheet(vaultHtml);
  },
  restoreMl(el){const m=ml(el.dataset.id);m.archived=false;save();refreshSheet(vaultHtml);toast('已恢复到保管箱');},
  dayNav(el){ui.todayDate=addDays(ui.todayDate||today(),+el.dataset.d);render();},
  dayToday(){ui.todayDate=today();render();},
  carry(el){const e=S.ledger.find(x=>x.id===el.dataset.id);if(e){carryToToday(e);toast('已顺延到今天');render();}},
  calNav(el){let m=ui.calM+(+el.dataset.d),y=ui.calY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}ui.calM=m;ui.calY=y;render();},
  calToday(){const n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.calSel=today();render();},
  calSel(el){ui.calSel=el.dataset.d;const d=parseD(ui.calSel);if(d.getMonth()!==ui.calM){ui.calM=d.getMonth();ui.calY=d.getFullYear();}render();},
  exportDl, exportShare, exportCopy, forgotPw,
  lockNow(){lock();},
  changePw(){changePwSheet();},
  expFmt(el){
    const f=el.dataset.f;if(f===ui.expFmt)return;
    if(f==='plain'&&!confirm('明文备份不加密，任何拿到文件的人都能看到你的全部内容。\n\n仍然选择明文备份吗？'))return;
    ui.expFmt=f;
    document.querySelectorAll('#expSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
    const w=$('#plainWarn');if(w)w.classList.toggle('hidden',f!=='plain');
    const eb=$('#exportBox');if(eb)eb.classList.add('hidden');
    if(f==='enc')prepareExport();
  },
  importFile(){const f=$('#fileInput');f.value='';f.click();},
  importPaste(){const v=($('#importBox')||{}).value||'';if(!v.trim()){toast('请先粘贴 JSON');return;}doImport(v);},
  async restoreBak(){
    let b=null;try{b=await readBackup();}catch(e){}
    if(!b||!b.data){alert('没有可用的备份');return;}
    if(!confirm('用「导入前备份」（'+new Date(b.savedAt).toLocaleString('zh-CN')+'）覆盖当前数据？当前数据会与之互换保存。'))return;
    try{const d=validate(b.data);await writeBackup({savedAt:Date.now(),data:S});S=d;await save();closeSheet();toast('已恢复');}catch(e){alert('恢复失败：'+e.message);}
  },
  async resetGuide(){
    if(!confirm('用导览示例数据替换当前全部数据？当前数据会先加密自动备份，可在设置里恢复。'))return;
    try{await writeBackup({savedAt:Date.now(),data:S});}catch(e){}
    S=seed();await save();closeSheet();toast('已重置');
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}
});
document.addEventListener('keydown',e=>{
  if(!isEnter(e))return;
  const id=e.target.id, v=(e.target.value||'').trim();
  if(id==='taskInput'){e.preventDefault();if(!v)return;const m=cur();const t=newTask(m.id,v);S.tasks.push(t);if(!m.focusTaskId||!task(m.focusTaskId)||task(m.focusTaskId).done)m.focusTaskId=t.id;save();e.target.value='';render();toast('已添加任务');}
  else if(id==='quickInput'||id==='ideaInput'){e.preventDefault();if(!v)return;const n=Date.now();S.ideas.push({id:uid(),title:v,notes:'',state:'new',mainlineId:null,createdAt:n,updatedAt:n});save();e.target.value='';
    if(id==='quickInput'){toast('💡 已放入候审区，继续手上的事吧');}else{ui.ideaFilter=ui.ideaFilter==='all'||ui.ideaFilter==='new'?ui.ideaFilter:'all';render();toast('已记录');}}
  else if(id==='inboxInput'){e.preventDefault();if(!v)return;const D=ui.todayDate||today();const t=newTask(null,v);S.tasks.push(t);schedule(t,D);e.target.value='';render();toast('已加入收集箱');}
  else if(e.target.classList.contains('title-input')){e.preventDefault();e.target.blur();}
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  const[kind,id,field]=b.split('.');
  const obj=kind==='task'?task(id):kind==='ml'?ml(id):idea(id);if(!obj)return;
  obj[field]=e.target.value;obj.updatedAt=Date.now();
  if(kind==='task'&&field==='title')syncSnapshot(obj);
  if(kind==='ml'&&field==='title'){S.ledger.forEach(en=>{if(en.mainlineId===obj.id&&en.date>=today())en.mainlineTitle=obj.title;});}
  saveSoon();
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.bind&&saveTimer)flush();});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='datePick'){if(e.target.value){ui.todayDate=e.target.value;render();}}
  else if(id==='schedPick'){const t=task(e.target.dataset.id);schedule(t,e.target.value||null);refreshSheet(()=>taskSheetHtml(t));if(e.target.value)toast('已安排到 '+fmtDay(e.target.value));}
  else if(id==='moveSel'){const t=task(e.target.dataset.id);const old=t.mainlineId&&ml(t.mainlineId);if(old&&old.focusTaskId===t.id)old.focusTaskId=null;t.mainlineId=e.target.value||null;syncSnapshot(t);save();refreshSheet(()=>taskSheetHtml(t));toast('已移到「'+mlName(t.mainlineId)+'」');}
  else if(id==='ideaMl'){const i=idea(e.target.dataset.id);i.mainlineId=e.target.value||null;save();}
  else if(id==='fileInput'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>alert('读取文件失败');r.readAsText(f);}
});
// date box: desktop browsers need showPicker
document.addEventListener('click',e=>{if(e.target.id==='datePick'&&e.target.showPicker){try{e.target.showPicker();}catch(_){}}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='setupForm')doSetup();else if(id==='unlockForm')doUnlock();
  else if(id==='pwChangeForm')doChangePw();else if(id==='impPwForm')doImpPw();
});
window.addEventListener('storage',e=>{
  if(e.key!==KEY_ENC||!e.newValue||!K)return;
  try{const b=JSON.parse(e.newValue);
    if(b.salt!==b64(SALT)){lock();return;} // 另一个窗口改了密码
    decBlob(b,K).then(t=>{S=validate(JSON.parse(t));if(!$('#overlay'))render();}).catch(()=>{});
  }catch(_){}
});
// day rollover while app stays open
let lastDay=today();
setInterval(()=>{if(!S)return;if(today()!==lastDay){if(!ui.todayDate||ui.todayDate===lastDay)ui.todayDate=null;lastDay=today();if(!$('#overlay'))render();}},60000);

boot();
window.__entp={get state(){return S;},ui};
})();
</script>
</body>
</html>
